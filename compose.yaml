services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      # Local development default only. Override with POSTGRES_PASSWORD in a .env file.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  fleet-management-service:
    build:
      context: ./fleet-management-service
    environment:
      FLEET_DB_URL: jdbc:postgresql://postgres:5432/fleet
      FLEET_DB_USER: fleet
      FLEET_DB_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      # "dev" also loads the demo zones. Remove this line for an empty zones table.
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  operator-dashboard:
    build:
      context: ./operator-dashboard
    ports:
      - "8081:80"
    restart: unless-stopped
  kafka:
    image: apache/kafka:4.1.1
    ports:
      - "127.0.0.1:29092:29092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ai-mcp-schema-viewer:
    build:
      context: ./schema-viewer
    ports:
      - "8082:80"
    volumes:
      - ./contracts/ai-mcp/v1:/usr/share/nginx/html/contracts:ro
    restart: unless-stopped
  ai-mcp-service:
    build:
      context: .
      dockerfile: ai-mcp/Dockerfile
    ports:
      - "8083:8083"
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL:-http://fleet-management-service:8080/api/v1/}
      MCP_AREA_ZONE_MAP_JSON: ${MCP_AREA_ZONE_MAP_JSON:-}
      MCP_STATE_DIR: /data
    volumes:
      - ai-mcp-state:/data
    depends_on:
      fleet-management-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8083/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  telemetry:
    profiles: [telemetry]
    build:
      context: ./telemetry-ingestion-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TELEMETRY_SIMULATOR_ENABLED: ${TELEMETRY_SIMULATOR_ENABLED:-false}
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  kafka-data:
  ai-mcp-state:
