spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    admin:
      fail-fast: true
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        retry.backoff.ms: 1000
        request.timeout.ms: 30000
        delivery.timeout.ms: 120000

telemetry:
  simulator:
    scenario: ${TELEMETRY_SIMULATOR_SCENARIO:baseline}
    vehicle-id: ${TELEMETRY_SIMULATOR_VEHICLE_ID:veh_001}
    start-at: ${TELEMETRY_SIMULATOR_START_AT:}
    replay-at: ${TELEMETRY_SIMULATOR_REPLAY_AT:2026-11-05T20:00:00Z}
