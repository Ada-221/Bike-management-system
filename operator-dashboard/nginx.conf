server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        resolver 127.0.0.11 valid=10s;
        set $fleet_api http://fleet-management-service:8080;
        proxy_pass $fleet_api$request_uri;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
