# Week 3 extension of the isolated frontend stack, using existing team services.
services:
  fleet-management-service:
    environment:
      FLEET_KAFKA_ENABLED: "true"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-topics:
        condition: service_completed_successfully
  kafka:
    image: apache/kafka:4.1.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - smoke-kafka:/var/lib/kafka/data
    healthcheck:
      test:
        [
          CMD,
          /opt/kafka/bin/kafka-topics.sh,
          --bootstrap-server,
          localhost:9092,
          --list,
        ]
      interval: 5s
      timeout: 5s
      retries: 30
  kafka-topics:
    image: apache/kafka:4.1.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [/bin/bash, -ec]
    command:
      - |
        for topic in fleet.vehicle fleet.rental fleet.maintenance; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 1 --replication-factor 1 --config cleanup.policy=delete --config retention.ms=-1
        done
  telemetry:
    profiles: [telemetry]
    build:
      context: ../telemetry-ingestion-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
volumes:
  smoke-kafka:
