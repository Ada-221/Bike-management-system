services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 2s
      retries: 30
  fleet-management-service:
    build: ../build/mcp-integration/fleet-management-service
    environment:
      FLEET_DB_URL: jdbc:postgresql://postgres:5432/fleet
      FLEET_DB_USER: fleet
      FLEET_DB_PASSWORD: fleet
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      postgres:
        condition: service_healthy
  mcp:
    image: cebp-ai-mcp:week2
    environment:
      BACKEND_API_URL: http://fleet-management-service:8080/api/v1/
      MCP_AREA_ZONE_MAP_JSON: '{"area_center":"zone_001","area_south":"zone_002"}'
    depends_on:
      - fleet-management-service
